<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:720px; overflow:hidden;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  body {
    background:radial-gradient(1100px 700px at 70% 30%, #12351f 0%, #0a0e14 55%, #05070b 100%);
    display:flex; align-items:center; justify-content:center; gap:60px;
    color:#e8f5ec; position:relative; padding:0 80px;
  }
  .grid {
    position:absolute; inset:0;
    background-image:linear-gradient(rgba(34,224,122,.06) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(34,224,122,.06) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(700px 600px at 70% 40%,#000,transparent 80%);
  }
  .panel { position:relative; z-index:2; width:560px; padding:28px 30px;
    border-radius:20px; background:#0e141c; border:1px solid rgba(34,224,122,.28);
    box-shadow:0 30px 80px rgba(0,0,0,.5); }
  .urlbar { font:600 16px "JetBrains Mono",Consolas,monospace; color:#cfeeda;
    padding:14px 16px; border-radius:10px; background:rgba(0,0,0,.35);
    border:1px solid rgba(34,224,122,.2); margin-bottom:22px; word-break:break-all; line-height:1.7; }
  .urlbar .p { color:#22e07a; }
  .bars { display:flex; align-items:flex-end; gap:16px; height:150px; padding:0 6px; }
  .bar { flex:1; background:linear-gradient(180deg,#22e07a,#0f8f4d);
    border-radius:6px 6px 0 0; position:relative; }
  .bar span { position:absolute; top:-24px; left:0; right:0; text-align:center;
    font-size:13px; color:#8bf5b6; }
  .bar em { position:absolute; bottom:-26px; left:0; right:0; text-align:center;
    font-size:13px; opacity:.55; font-style:normal; }
  .right { position:relative; z-index:2; width:470px; }
  .kicker { font:700 18px "JetBrains Mono",Consolas,monospace; letter-spacing:3px;
    color:#22e07a; margin-bottom:18px; }
  .kicker::before { content:"▎"; color:#22e07a; }
  h1 { font-size:50px; font-weight:800; line-height:1.2; color:#fff; margin-bottom:26px; }
  h1 .hl { color:#22e07a; }
  .feat { display:flex; align-items:center; gap:12px; font-size:19px;
    color:#cfeeda; margin-bottom:16px; font-weight:300; }
  .feat b { color:#fff; font-weight:600; }
  .dot { color:#22e07a; font-size:20px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="panel">
    <div class="urlbar">th.link/spring?<span class="p">utm_source</span>=wechat&amp;<span class="p">utm_medium</span>=cpc&amp;<span class="p">utm_campaign</span>=spring2026</div>
    <div class="bars">
      <div class="bar" style="height:82%"><span>4.2k</span><em>微信</em></div>
      <div class="bar" style="height:60%"><span>3.1k</span><em>抖音</em></div>
      <div class="bar" style="height:44%"><span>2.3k</span><em>小红书</em></div>
      <div class="bar" style="height:30%"><span>1.5k</span><em>直接</em></div>
      <div class="bar" style="height:20%"><span>980</span><em>其他</em></div>
    </div>
  </div>
  <div class="right">
    <div class="kicker">UTM TRACKING</div>
    <h1>自动带上参数<br><span class="hl">点击实时入库</span></h1>
    <div class="feat"><span class="dot">●</span><span><b>来源渠道</b>：谁把人带来的</span></div>
    <div class="feat"><span class="dot">●</span><span><b>地域设备</b>：在哪、用什么设备</span></div>
    <div class="feat"><span class="dot">●</span><span><b>实时看板</b>：数据秒级刷新</span></div>
  </div>
</body>
</html>
